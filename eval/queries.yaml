    query: 手机上应用自动化测试工程怎么搭
    expect_any: [AutoTest, 自动化测试, 自动测试]
  - id: whisper-install
    query: 本地语音识别模型 faster whisper 装好了吗
    expect_any: [faster-whisper, faster_whisper]
  - id: starship-prompt
    query: 终端提示字体的美化工具怎么启用
    expect_any: [Starship, starship]
  - id: tts-config
    query: 文字转语音朗读功能配置在哪里
    expect_any: [语音, TTS, 朗读]
  - id: qwen-gguf
    query: 千问的大模型 GGUF 权重文件放到本地怎么用
    expect_any: [Qwen, qwen, GGUF, gguf]
