[project]
name = "asrag"
version = "0.1.0"
description = "会话向量化 + 记忆召回（存储/召回层预研，脱离 MemOS）"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
