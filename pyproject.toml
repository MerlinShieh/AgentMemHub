[project]
name = "agentmemhub"
version = "0.1.0"
description = "统一提取多 Agent Harness 会话为全量事件流 → 内置记忆引擎 agentmemhub.rag（向量化/混合召回/价值评分，进程内直调）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "zstandard>=0.23",
    # 内置记忆引擎 agentmemhub.rag（原 AgentMemRAG，进程内直调、无独立服务）
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
    # 外部投喂转译层（agentmemhub/feed）：取回 + 正文抽取
    #   httpx       —— HTTP 抓取（浏览器 UA / 代理 / 流式限长）。此前已装在环境里
    #                  却没写进声明，属"隐形依赖"（2026-10-12 补上）
    #   trafilatura —— 正文抽取（Apache-2.0）。选型是**用真实样本对比**出来的：
    #                  公众号 3.6 MB 真页与 pushplus 文档站都能正确给出正文、标题、发布日期
    "httpx>=0.27",
    "trafilatura>=2.3",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
agentmemhub = "agentmemhub.cli:main"
agentmemhub-mcp = "agentmemhub.mcp_server:run_stdio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentmemhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
