[project]
name = "agentmemhub"
version = "0.1.0"
description = "统一提取多 Agent Harness 会话为全量事件流 → 内置记忆引擎 agentmemhub.rag（向量化/混合召回/价值评分，进程内直调）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "zstandard>=0.23",
    # 内置记忆引擎 agentmemhub.rag（原 AgentMemRAG，进程内直调、无独立服务）
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
agentmemhub = "agentmemhub.cli:main"
agentmemhub-mcp = "agentmemhub.mcp_server:run_stdio"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentmemhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
