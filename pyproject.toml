[project]
name = "agentmemhub"
version = "0.1.0"
description = "统一提取多 Agent Harness 会话为全量事件流（含工具链/思维链/Shell/补丁）→ SQLite 检索 → 桥接 MemOS 生成记忆"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
agentmemhub = "agentmemhub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentmemhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
